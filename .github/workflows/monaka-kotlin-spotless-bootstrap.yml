name: Monaka Kotlin baseline formatter (temporary)

on:
  push:
    branches:
      - chore/monaka-kotlin-spotless-baseline-20261021

permissions:
  contents: write

jobs:
  format-existing-kotlin:
    if: "!contains(github.event.head_commit.message, '[format-complete]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact formatter branch
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: true
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Apply repository's pinned Kotlin Spotless to baseline
        run: ./gradlew :server:spotlessKotlinApply --no-daemon --console=plain
      - name: Check resulting Kotlin formatting
        run: ./gradlew :server:spotlessKotlinCheck --no-daemon --console=plain
      - name: Audit and commit Kotlin-only baseline changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/chore/monaka-kotlin-spotless-baseline-20261021"
          mapfile -t paths < <(git diff --name-only)
          echo "changed Kotlin files: ${#paths[@]}"
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No Kotlin changes needed"
            exit 0
          fi
          for p in "${paths[@]}"; do
            case "$p" in
              server/*.kt|server/**/*.kt) ;;
              *) echo "Unexpected non-Kotlin change: $p"; exit 1 ;;
            esac
          done
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'server/**/*.kt'
          git diff --cached --check
          git commit -m "style(kotlin): normalize existing Spotless baseline [format-complete]"
          git push origin "HEAD:refs/heads/chore/monaka-kotlin-spotless-baseline-20261021"
